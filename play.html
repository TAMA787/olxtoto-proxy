<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Loading Game...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;text-align:center;overflow:hidden}
  .container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;max-width:340px}
  .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .game-name{font-size:20px;font-weight:700;color:#f59e0b}
  .progress-wrap{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:3px;transition:width .4s}
  .status{font-size:14px;color:rgba(255,255,255,0.5)}
  .countdown{font-size:28px;font-weight:700;color:#f59e0b}
  .btn{display:block;width:100%;padding:14px 20px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;color:#000}
  .btn-lobby{background:#22c55e}
  .btn-game{background:#f59e0b}
  .btn-back{background:rgba(255,255,255,0.08);color:#fff;font-size:13px;padding:10px}
  .note{font-size:12px;color:rgba(255,255,255,0.35);line-height:1.5}
  .hidden{display:none!important}
  .manual{display:none;flex-direction:column;gap:12px;width:100%}
  .manual.show{display:flex}
</style>
</head>
<body>

<!-- Loading state -->
<div class="container" id="main">
  <div class="spinner" id="spinner"></div>
  <div class="game-name" id="gameName">Loading...</div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="status" id="status">Menyiapkan sesi game...</div>
  <div class="countdown hidden" id="cd"></div>

  <!-- Fallback manual (jika popup diblokir) -->
  <div class="manual" id="manual">
    <p class="status">Popup diblokir. Ikuti langkah manual:</p>
    <a id="btnLobby" class="btn btn-lobby" href="#" target="_blank">🔗 Step 1: Buka Lobby</a>
    <a id="btnGame" class="btn btn-game" href="#" target="_blank">▶️ Step 2: Main Game</a>
    <button class="btn btn-back" onclick="history.back()">← Kembali ke Bot</button>
    <p class="note">Klik Step 1 dulu, tunggu lobby terbuka, lalu klik Step 2.</p>
  </div>
</div>

<script>
(function(){
  var P = new URLSearchParams(location.search);

  function d(s){
    if(!s) return '';
    try{
      s = s.replace(/-/g,'+').replace(/_/g,'/');
      while(s.length%4) s+='=';
      return decodeURIComponent(atob(s));
    } catch(e){
      try{ return decodeURIComponent(s); } catch(e2){ return s; }
    }
  }

  var lobby = d(P.get('lobby'));
  var game  = d(P.get('game'));
  var name  = P.get('name') ? d(P.get('name')) : 'Game';
  var mode  = P.get('mode') || 'proxy';

  var $name   = document.getElementById('gameName');
  var $status = document.getElementById('status');
  var $bar    = document.getElementById('bar');
  var $cd     = document.getElementById('cd');
  var $spin   = document.getElementById('spinner');
  var $manual = document.getElementById('manual');

  if(!lobby){ $status.textContent='Link tidak valid.'; return; }
  $name.textContent = name;

  // Mode lobby → langsung redirect
  if(mode==='lobby' || !game){
    $bar.style.width='100%';
    $status.textContent='Membuka lobby...';
    setTimeout(function(){ location.replace(lobby); }, 400);
    return;
  }

  // ═══ MODE PROXY: Buka lobby di tab baru → tunggu → redirect ke game ═══

  $bar.style.width='10%';
  $status.textContent='Membuka sesi autentikasi...';

  // Buka lobby di tab/window baru (set cookie di browser)
  var authWin = null;
  try {
    authWin = window.open(lobby, '_blank');
  } catch(e){}

  if(!authWin || authWin.closed){
    // Popup diblokir → tampilkan manual
    $spin.classList.add('hidden');
    $bar.style.width='0%';
    $status.textContent='';
    $manual.classList.add('show');
    document.getElementById('btnLobby').href = lobby;
    document.getElementById('btnGame').href = game;
    return;
  }

  // Popup berhasil → countdown lalu redirect ke game
  $bar.style.width='30%';
  $status.textContent='Mengautentikasi sesi...';
  $cd.classList.remove('hidden');

  var wait = 5; // detik tunggu lobby set cookie
  $cd.textContent = wait;

  var timer = setInterval(function(){
    wait--;
    $cd.textContent = wait > 0 ? wait : '▶️';
    $bar.style.width = (30 + (5-wait)*14) + '%';

    if(wait === 3){
      $status.textContent = 'Sesi siap, menyiapkan game...';
    }
    if(wait <= 0){
      clearInterval(timer);
      $bar.style.width = '100%';
      $status.textContent = 'Membuka ' + name + '...';
      $cd.classList.add('hidden');

      // Tutup tab lobby (opsional, mungkin diblokir)
      try{ authWin.close(); } catch(e){}

      // Redirect ke game!
      setTimeout(function(){
        location.replace(game);
      }, 500);
    }
  }, 1000);

})();
</script>
</body>
</html>
