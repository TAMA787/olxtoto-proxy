<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Loading Game...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;text-align:center;overflow:hidden}
  .container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;max-width:340px}
  .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .game-name{font-size:20px;font-weight:700;color:#f59e0b}
  .progress-wrap{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:3px;transition:width .3s}
  .status{font-size:14px;color:rgba(255,255,255,0.5)}
  .error-box{display:none;flex-direction:column;align-items:center;gap:16px}
  .error-box.show{display:flex}
  .error-msg{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.5}
  .btn{padding:12px 32px;background:#f59e0b;color:#000;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="container" id="loading">
  <div class="spinner"></div>
  <div class="game-name" id="gameName">Loading...</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="status" id="status">Menyiapkan sesi game...</div>
</div>
<div class="container error-box" id="errorBox">
  <div style="font-size:48px">⚠️</div>
  <div class="error-msg" id="errorMsg">Link tidak valid.</div>
  <button class="btn" onclick="window.close()">Tutup</button>
</div>
<iframe id="authFrame" class="hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var lobbyUrl = params.get('lobby');
  var gameUrl = params.get('game');
  var gameName = params.get('name') || 'Game';

  try {
    if(lobbyUrl) lobbyUrl = decodeURIComponent(atob(lobbyUrl.replace(/-/g,'+').replace(/_/g,'/')));
    if(gameUrl) gameUrl = decodeURIComponent(atob(gameUrl.replace(/-/g,'+').replace(/_/g,'/')));
    if(gameName!=='Game') gameName = decodeURIComponent(atob(gameName.replace(/-/g,'+').replace(/_/g,'/')));
  } catch(e) {
    try {
      lobbyUrl = lobbyUrl ? decodeURIComponent(lobbyUrl) : null;
      gameUrl = gameUrl ? decodeURIComponent(gameUrl) : null;
      gameName = gameName!=='Game' ? decodeURIComponent(gameName) : gameName;
    } catch(e2){}
  }

  var elName = document.getElementById('gameName');
  var elStatus = document.getElementById('status');
  var elProgress = document.getElementById('progressBar');
  var elLoading = document.getElementById('loading');
  var errorBox = document.getElementById('errorBox');
  var elErrMsg = document.getElementById('errorMsg');
  var authFrame = document.getElementById('authFrame');
  var targetUrl = gameUrl || lobbyUrl;

  if(!lobbyUrl || !targetUrl){
    elLoading.classList.add('hidden');
    elErrMsg.textContent = 'Link tidak valid. Silakan kembali ke bot dan pilih game lagi.';
    errorBox.classList.add('show');
    return;
  }

  elName.textContent = gameName;
  var redirected = false;

  function setProgress(pct){ elProgress.style.width = pct+'%'; }

  function doRedirect(){
    if(redirected) return;
    redirected = true;
    setProgress(100);
    elStatus.textContent = 'Membuka game...';
    setTimeout(function(){ window.location.replace(targetUrl); }, 300);
  }

  // Cek apakah cookies sudah ada (pernah buka lobby sebelumnya)
  var cookieKey = 'idn_auth_ok';
  var hasAuth = false;
  try { hasAuth = localStorage.getItem(cookieKey) === '1'; } catch(e){}

  if(hasAuth){
    // SUDAH pernah auth → langsung redirect ke game
    setProgress(50);
    elStatus.textContent = 'Memuat game...';
    doRedirect();
  } else {
    // BELUM pernah auth → buka lobby dulu untuk set cookies
    // Simpan flag bahwa sudah auth
    try { localStorage.setItem(cookieKey, '1'); } catch(e){}

    setProgress(10);
    elStatus.textContent = 'Menyiapkan sesi pertama kali...';

    // Redirect ke lobby (top-level, bukan iframe) → set first-party cookies
    setTimeout(function(){
      setProgress(50);
      elStatus.textContent = 'Menghubungkan ke server...';
      setTimeout(function(){
        window.location.replace(lobbyUrl);
      }, 800);
    }, 500);
  }
})();
</script>
</body>
</html>
