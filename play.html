<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Loading Game...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;text-align:center;overflow:hidden}
  .container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;max-width:340px}
  .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .game-name{font-size:20px;font-weight:700;color:#f59e0b}
  .progress-wrap{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:3px;transition:width .3s}
  .status{font-size:14px;color:rgba(255,255,255,0.5)}
  .error-box{display:none;flex-direction:column;align-items:center;gap:16px}
  .error-box.show{display:flex}
  .error-msg{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.5}
  .btn{padding:12px 32px;background:#f59e0b;color:#000;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:#d97706}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="container" id="loading">
  <div class="spinner"></div>
  <div class="game-name" id="gameName">Loading...</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="status" id="status">Menyiapkan sesi game...</div>
</div>
<div class="container error-box" id="errorBox">
  <div style="font-size:48px">⚠️</div>
  <div class="error-msg" id="errorMsg">Link tidak valid.</div>
  <a class="btn" href="javascript:history.back()">Kembali</a>
</div>
<script>
(function(){
  'use strict';

  var params = new URLSearchParams(window.location.search);
  var lobbyParam = params.get('lobby');
  var gameParam  = params.get('game');
  var nameParam  = params.get('name');

  // ── Base64url decode helper ──
  function b64urlDecode(str) {
    if (!str) return null;
    try {
      // Restore standard base64: replace URL-safe chars, add padding
      var b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4 !== 0) b64 += '=';
      return decodeURIComponent(atob(b64));
    } catch (e) {
      // Fallback: try as plain URI-encoded string
      try { return decodeURIComponent(str); } catch (e2) { return str; }
    }
  }

  var lobbyUrl = b64urlDecode(lobbyParam);
  var gameUrl  = b64urlDecode(gameParam);
  var gameName = nameParam ? b64urlDecode(nameParam) : 'Game';

  // ── DOM refs ──
  var elName    = document.getElementById('gameName');
  var elStatus  = document.getElementById('status');
  var elProgress= document.getElementById('progressBar');
  var elLoading = document.getElementById('loading');
  var errorBox  = document.getElementById('errorBox');
  var elErrMsg  = document.getElementById('errorMsg');

  // Target: prefer game URL, fallback to lobby
  var targetUrl = gameUrl || lobbyUrl;

  // ── Validate ──
  if (!lobbyUrl || !targetUrl) {
    elLoading.classList.add('hidden');
    elErrMsg.textContent = 'Link tidak valid. Silakan kembali ke bot dan pilih game lagi.';
    errorBox.classList.add('show');
    return;
  }

  elName.textContent = gameName || 'Game';

  function setProgress(pct) { elProgress.style.width = pct + '%'; }

  var redirected = false;
  function doRedirect(url) {
    if (redirected) return;
    redirected = true;
    setProgress(100);
    elStatus.textContent = 'Membuka game...';
    setTimeout(function() { window.location.replace(url); }, 300);
  }

  // ── Auth session tracking (per-domain) ──
  var domain;
  try { domain = new URL(lobbyUrl).hostname; } catch(e) { domain = 'default'; }
  var storageKey = 'auth_' + domain;
  var hasAuth = false;
  try { hasAuth = sessionStorage.getItem(storageKey) === '1'; } catch(e) {}

  if (hasAuth && gameUrl) {
    // Already authenticated for this domain → go straight to game
    setProgress(50);
    elStatus.textContent = 'Memuat game...';
    doRedirect(gameUrl);
  } else {
    // First visit or no game URL → go through lobby to establish session
    try { sessionStorage.setItem(storageKey, '1'); } catch(e) {}

    setProgress(10);
    elStatus.textContent = 'Menyiapkan sesi...';

    setTimeout(function() {
      setProgress(50);
      elStatus.textContent = 'Menghubungkan ke server...';
      setTimeout(function() {
        // If we have a specific game URL but need auth first, go to lobby
        // Next time user opens a game on this domain, they'll skip to game directly
        doRedirect(lobbyUrl);
      }, 600);
    }, 400);
  }

  // ── Safety timeout: if nothing happens in 15s, show error ──
  setTimeout(function() {
    if (!redirected) {
      elLoading.classList.add('hidden');
      elErrMsg.textContent = 'Koneksi timeout. Silakan coba lagi.';
      errorBox.classList.add('show');
    }
  }, 15000);
})();
</script>
</body>
</html>
