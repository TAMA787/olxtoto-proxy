<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Loading Game...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;text-align:center;overflow:hidden}
  .container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;max-width:340px}
  .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .game-name{font-size:20px;font-weight:700;color:#f59e0b}
  .progress-wrap{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:3px;transition:width .3s}
  .status{font-size:14px;color:rgba(255,255,255,0.5)}
  .hint{font-size:13px;color:rgba(255,255,255,0.4);line-height:1.5}
  .box{display:none;flex-direction:column;align-items:center;gap:16px}
  .box.show{display:flex}
  .msg{font-size:15px;color:rgba(255,255,255,0.75);line-height:1.5}
  .btn{padding:12px 32px;background:#f59e0b;color:#000;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.ghost{background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15);font-weight:500;padding:10px 24px;font-size:14px}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="container" id="loading">
  <div class="spinner"></div>
  <div class="game-name" id="gameName">Loading...</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="status" id="status">Menyiapkan sesi game...</div>
</div>

<!-- Sesi belum aktif / sudah kedaluwarsa → harus lewat lobby dulu -->
<div class="container box" id="authBox">
  <div style="font-size:44px">🔐</div>
  <div class="game-name" id="authGameName">Game</div>
  <div class="msg">Sesi IDN belum aktif. Buka lobby dulu untuk mengaktifkan sesi, lalu kembali ke bot dan pilih game ini lagi.</div>
  <a class="btn" id="authBtn" href="#">Aktifkan Sesi (Buka Lobby)</a>
  <div class="hint">Setelah lobby terbuka, sesi aktif ±<span id="ttlMin">5</span> menit.</div>
</div>

<!-- Link rusak -->
<div class="container box" id="errorBox">
  <div style="font-size:48px">⚠️</div>
  <div class="msg" id="errorMsg">Link tidak valid.</div>
  <button class="btn" onclick="window.close()">Tutup</button>
</div>

<script>
(function(){
  // Sesi IDN dianggap masih hidup selama TTL_MS setelah lobby dibuka.
  // Dibikin pendek — cookie sesi IDN umurnya memang sebentar, dan flag yang
  // kepanjangan bikin play.html nembak game URL tanpa sesi → "Session Empty".
  var TTL_MS = 5 * 60 * 1000;
  var STORE_KEY = 'idn_auth_v2';   // key baru → flag permanen versi lama otomatis diabaikan

  var params   = new URLSearchParams(window.location.search);
  var lobbyUrl = params.get('lobby');
  var gameUrl  = params.get('game');
  var gameName = params.get('name') || 'Game';
  var mode     = params.get('mode') || 'proxy';
  var force    = params.get('force');   // force=lobby → paksa ulang lewat lobby

  function b64urlDecode(v){
    if(!v) return null;
    try { return decodeURIComponent(atob(v.replace(/-/g,'+').replace(/_/g,'/'))); }
    catch(e){ try { return decodeURIComponent(v); } catch(e2){ return v; } }
  }

  lobbyUrl = b64urlDecode(lobbyUrl);
  gameUrl  = b64urlDecode(gameUrl);
  if(gameName !== 'Game') gameName = b64urlDecode(gameName) || 'Game';

  var elName     = document.getElementById('gameName');
  var elStatus   = document.getElementById('status');
  var elProgress = document.getElementById('progressBar');
  var elLoading  = document.getElementById('loading');
  var authBox    = document.getElementById('authBox');
  var errorBox   = document.getElementById('errorBox');
  var elErrMsg   = document.getElementById('errorMsg');

  function showError(msg){
    elLoading.classList.add('hidden');
    elErrMsg.textContent = msg;
    errorBox.classList.add('show');
  }

  if(!lobbyUrl){
    showError('Link tidak valid. Silakan kembali ke bot dan pilih game lagi.');
    return;
  }

  elName.textContent = gameName;
  document.getElementById('ttlMin').textContent = Math.round(TTL_MS / 60000);

  function setProgress(pct){ elProgress.style.width = pct + '%'; }

  function readAuthTs(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return 0;
      var data = JSON.parse(raw);
      // Flag terikat ke host lobby — ganti situs/agen, sesi ikut dianggap baru.
      if(data.host !== new URL(lobbyUrl).host) return 0;
      return data.ts || 0;
    } catch(e){ return 0; }
  }

  function markAuthed(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        host: new URL(lobbyUrl).host,
        ts: Date.now()
      }));
    } catch(e){}
  }

  function goTo(url, label){
    setProgress(100);
    elStatus.textContent = label;
    setTimeout(function(){ window.location.replace(url); }, 300);
  }

  // ── mode=lobby → memang cuma buka lobby, user pilih game di dalam ──
  if(mode === 'lobby' || !gameUrl){
    markAuthed();
    setProgress(60);
    goTo(lobbyUrl, 'Membuka lobby...');
    return;
  }

  // ── mode=proxy → butuh sesi IDN yang masih hidup ──
  var age = Date.now() - readAuthTs();
  var sessionFresh = readAuthTs() > 0 && age < TTL_MS;

  if(sessionFresh && force !== 'lobby'){
    setProgress(50);
    elStatus.textContent = 'Memuat game...';
    goTo(gameUrl, 'Membuka game...');
    return;
  }

  // Sesi belum ada / sudah basi → JANGAN tembak game URL (pasti "Session Empty").
  // Tampilkan tombol, biar user yang memicu navigasi ke lobby.
  // Flag baru ditulis saat tombol diklik — bukan sebelum auth benar-benar jalan.
  elLoading.classList.add('hidden');
  document.getElementById('authGameName').textContent = gameName;
  var authBtn = document.getElementById('authBtn');
  authBtn.href = lobbyUrl;
  authBtn.addEventListener('click', function(e){
    e.preventDefault();
    markAuthed();
    window.location.replace(lobbyUrl);
  });
  authBox.classList.add('show');
})();
</script>
</body>
</html>
