<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>IDN Poker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
iframe{width:100%;height:100%;border:none}
#loader{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;
  align-items:center;justify-content:center;background:#1a1a2e;z-index:9999;
  color:#fff;font-family:sans-serif;font-size:16px}
#loader.hide{display:none}
</style>
</head>
<body>
<div id="loader">⏳ Memuat IDN Poker...</div>

<!--
  SANDBOX khusus IDN Poker:
  - allow-scripts        : JS lobby perlu jalan
  - allow-same-origin    : cookies/session PIN validation
  - allow-forms          : form PIN 6 digit
  - allow-top-navigation-by-user-activation : klik PLAY navigasi ke top frame
                           (bukan buka tab baru)
  - TANPA allow-popups   : BLOKIR window.open() → force navigasi in-place
-->
<iframe id="game"
  sandbox="allow-scripts allow-same-origin allow-forms allow-top-navigation-by-user-activation allow-modals"
  allow="autoplay; fullscreen; clipboard-write"
></iframe>

<script>
(function(){
  var KEY = 'olxtoto2026';

  // ── Decrypt ?d= param (XOR + base64url) ──
  function decrypt(encoded) {
    try {
      // base64url → base64
      var b64 = encoded.replace(/-/g,'+').replace(/_/g,'/');
      while (b64.length % 4) b64 += '=';
      var raw = atob(b64);
      var result = '';
      for (var i = 0; i < raw.length; i++) {
        result += String.fromCharCode(
          raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)
        );
      }
      return result;
    } catch(e) { return ''; }
  }

  // ── Parse URL ──
  var params = new URLSearchParams(location.search);
  var targetUrl = '';

  // Format 1: ?d= (encrypted, dari proxy_server.py)
  var d = params.get('d');
  if (d) {
    try {
      var json = JSON.parse(decrypt(d));
      targetUrl = json.l || json.g || '';
    } catch(e) {}
  }

  // Format 2: ?url= (plain base64, fallback)
  if (!targetUrl) {
    var u = params.get('url');
    if (u) {
      try {
        var b = u.replace(/-/g,'+').replace(/_/g,'/');
        while (b.length % 4) b += '=';
        targetUrl = decodeURIComponent(atob(b));
      } catch(e) { targetUrl = u; }
    }
  }

  if (!targetUrl) {
    document.getElementById('loader').textContent = '❌ URL tidak valid';
    return;
  }

  var iframe = document.getElementById('game');
  var loader = document.getElementById('loader');

  // ── Load target URL di sandboxed iframe ──
  iframe.src = targetUrl;

  iframe.onload = function() {
    loader.classList.add('hide');
  };

  // Timeout loader
  setTimeout(function() {
    loader.classList.add('hide');
  }, 10000);

  // ── Fallback: jika iframe error, redirect langsung ──
  iframe.onerror = function() {
    location.replace(targetUrl);
  };

})();
</script>
</body>
</html>
